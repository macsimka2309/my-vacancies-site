# Логи контейнеров по умолчанию растут без потолка: json-файл живёт, пока
# жив контейнер, и его никто не ротирует. Три файла по 10 МБ — это около
# месяца при нынешнем объёме и жёсткая верхняя граница в 30 МБ на сервис.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrator
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    command: ["pnpm", "prisma:deploy"]

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
